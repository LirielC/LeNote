name: Android Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Build Release & Debug APKs
        run: ./gradlew assembleRelease assembleDebug

      - name: Rename APKs for Release
        run: |
          TAG_NAME="${GITHUB_REF_NAME:-v1.0.2}"
          cp app/build/outputs/apk/release/app-release.apk "LeNote-${TAG_NAME}-release.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "LeNote-${TAG_NAME}-debug.apk"

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LeNote-APKs
          path: |
            LeNote-*-release.apk
            LeNote-*-debug.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            LeNote-*-release.apk
            LeNote-*-debug.apk
          generate_release_notes: true
