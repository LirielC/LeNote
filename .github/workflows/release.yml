name: Validate Android Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build and validate production APK
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build and validate signed Release APK
        env:
          LENOTE_KEYSTORE_BASE64: ${{ secrets.LENOTE_KEYSTORE_BASE64 }}
          LENOTE_KEYSTORE_PASSWORD: ${{ secrets.LENOTE_KEYSTORE_PASSWORD }}
          LENOTE_KEY_ALIAS: ${{ secrets.LENOTE_KEY_ALIAS }}
          LENOTE_KEY_PASSWORD: ${{ secrets.LENOTE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          KEYSTORE_PATH="${RUNNER_TEMP}/lenote-release.jks"
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          CERTIFICATE_SHA256="88C8516EF396045B5DF29E76C20E4057B728E3156A6D43AA88117B9C84F698BA"
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"

          cleanup() {
            rm -f -- "$KEYSTORE_PATH"
          }
          trap cleanup EXIT

          test -n "$LENOTE_KEYSTORE_BASE64"
          test -n "$LENOTE_KEYSTORE_PASSWORD"
          test -n "$LENOTE_KEY_ALIAS"
          test -n "$LENOTE_KEY_PASSWORD"
          test -n "$APKSIGNER"

          printf '%s' "$LENOTE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"

          # Validate the actual keystore credentials before Gradle starts the Release build.
          keytool -list \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$LENOTE_KEYSTORE_PASSWORD" \
            -alias "$LENOTE_KEY_ALIAS" \
            -keypass "$LENOTE_KEY_PASSWORD" \
            > /dev/null 2>&1

          export LENOTE_KEYSTORE_PATH="$KEYSTORE_PATH"
          ./gradlew verifyReleaseSigning
          ./gradlew assembleRelease

          test -f "$APK_PATH"
          "$APKSIGNER" verify --verbose --print-certs "$APK_PATH" > "${RUNNER_TEMP}/apksigner.txt"
          ACTUAL_CERTIFICATE_SHA256="$(grep -m 1 -Eio '[0-9a-f]{64}' "${RUNNER_TEMP}/apksigner.txt" | tr '[:lower:]' '[:upper:]')"
          if [[ -z "$ACTUAL_CERTIFICATE_SHA256" ]]; then
            echo "::error::Não foi possível extrair o SHA-256 do certificado do APK."
            exit 1
          fi
          if [[ "$ACTUAL_CERTIFICATE_SHA256" != "$CERTIFICATE_SHA256" ]]; then
            echo "::error::Certificado de assinatura divergente. Esperado: $CERTIFICATE_SHA256; encontrado: $ACTUAL_CERTIFICATE_SHA256"
            exit 1
          fi
          rm -f -- "${RUNNER_TEMP}/apksigner.txt"

      - name: Upload validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: LeNote-release-validation-${{ github.sha }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "app/build/outputs/apk/release/app-release.apk#LeNote-${GITHUB_REF_NAME}.apk" \
            --verify-tag \
            --generate-notes \
            --title "LeNote ${GITHUB_REF_NAME}" \
            --latest
